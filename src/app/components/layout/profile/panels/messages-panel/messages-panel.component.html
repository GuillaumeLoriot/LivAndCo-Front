<section class="max-w-md md:max-w-none md:w-96 mx-auto md:mx-0 px-4 py-8"
    [class.panel-hidden]="!(panelState.isOpen$ | async)" aria-labelledby="conversations-title">
    <h2 class="small-h1-title mb-6">Messagerie</h2>

    <div>
        <h2 id="conversations-title" class="sr-only">Liste des conversations</h2>

        <ul class="flex flex-col gap-4">
            @for (peer of peers; track peer.id) {

            <li>
                <a [routerLink]="['/profile/conversation', 1]"
                    class="flex items-center gap-4 rounded-2xl px-4 py-3 bg-[var(--color-secondary)] hover:opacity-90 transition">
                    <img src="/uploads/profile-pictures/{{peer.profilePicture}}" alt="Photo de {{peer.firstName}}"
                        class="w-12 h-12 rounded-full object-cover">
                    <div class="flex flex-col min-w-0">
                        <span class="font-bold">{{peer.firstName | titlecase}} {{peer.firstName | titlecase}}</span>
                        <span class="text-sm text-neutral-600 truncate">Lorem ipsum dolor sit amet…</span>
                    </div>
                </a>
            </li>
            }

        </ul>
    </div>
</section>
