<nav class="main-nav px-6 py-3 flex items-center justify-between shadow-lg">
    <a [routerLink]="['/']"
        class="flex items-center transform mx-4 tracking-wide hover:text-slate-400 hover:scale-110 transition-all duration-500">
        <img src="logos/logoVert2.png" alt="Logo" class="h-12 mr-3">
    </a>

    <ul class="hidden lg:flex w-4/6 justify-evenly items-center">
        <li><a [routerLink]="['/']" class="nav-link">Home</a></li>
        <li><a [routerLink]="['announcements']" class="nav-link">Annonces</a></li>
        <li><a [routerLink]="['help']" class="nav-link">Aide</a></li>
        <li><a [routerLink]="['contact']" class="nav-link">Contact</a></li>
        <li><a [routerLink]="['/profile/add-accomodation']" class="main-button">Ajouter un logement</a></li>
    </ul>

    <div class="flex items-center gap-2">
        <button type="button" class="inline-flex lg:hidden p-2 rounded-md border border-[var(--color-primary)]"
            (click)="toggleNav()" [attr.aria-expanded]="isOpen" aria-controls="main-mobile-menu"
            aria-label="Ouvrir le menu">
            @if (isOpen) {
            <img src="/icons/close.svg" alt="Fermer le menu" class="h-6 w-6">
            } @else {
            <img src="/icons/menu.svg" alt="Ouvrir le menu" class="h-6 w-6">
            }
        </button>

        @if (authService.isAuthenticated) {
        <button [routerLink]="['profile']" class="nav-link">
            <img src="/uploads/profile-pictures/{{authService.user?.profilePicture}}"
                alt="Photo de profil" class="w-10 rounded-full">
        </button>

        <button class="inline-flex" (click)="authService.logout()">
            <img class="w-10" src="/icons/logout.svg" alt="symbole de déconnexion">
        </button>
        }@else {
        <a [routerLink]="['login']" class="inline-flex">
            <img class="w-10" src="/icons/login-green.svg" alt="symbole de connexion">
        </a>
        }
    </div>
</nav>

@if (isOpen) {
<div id="main-mobile-menu" class="lg:hidden">
    <ul class="flex flex-col px-6 py-4 border-b-2 border-[var(--color-primary)] bg-[var(--color-background)] space-y-2">
        <li><a (click)="closeNav()" [routerLink]="['/']" class="nav-link py-2">Home</a></li>
        <li><a (click)="closeNav()" [routerLink]="['announcements']" class="nav-link py-2">Annonces</a></li>
        <li><a (click)="closeNav()" [routerLink]="['help']" class="nav-link py-2">Aide</a></li>
        <li><a (click)="closeNav()" [routerLink]="['contact']" class="nav-link py-2">Contact</a></li>
        <li><a (click)="closeNav()" [routerLink]="['profile']" class="nav-link py-2">Profil</a></li>
        <li><a (click)="closeNav()" [routerLink]="['/profile/add-announcement']" class="main-button w-fit">Déposer une
                annonce</a></li>
    </ul>
</div>
}
