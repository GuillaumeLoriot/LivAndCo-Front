@if (accomodation) {
<article
    class="announcement-card flex flex-col lg:flex-row mx-4 sm:mx-7 mb-7 h-auto lg:h-52 rounded-[60px] overflow-hidden">
    <!-- Image -->
    <div class="w-full lg:w-5/12 h-48 lg:h-full shrink-0">
        <img src="/uploads/images/{{accomodation.coverPicture}}" alt="image du logement"
            class="h-full w-full object-cover object-center">
    </div>

    <!-- Contenu -->
    <div class="flex flex-col justify-between w-full px-4 py-3">
        <h3>{{accomodation.city}}</h3>

        <div class="mb-4 lg:mb-7">
            <div class="flex flex-col w-full">
                <p class="py-2">Adresse: {{accomodation.addressLine1}}</p>
                <p>Code postal: {{accomodation.zipCode}}</p>
            </div>

            <div class="flex flex-wrap items-baseline gap-2 w-full py-4 lg:py-5">
                <p>{{accomodation.surface}} m²</p>
                <p>|</p>
                @if (!accomodation.mixedGender) {
                <p>Non mixte</p>
                } @else {
                <p>Mixte</p>
                }
            </div>
        </div>
    </div>

    <!-- Action -->
    <div
        class="flex justify-center lg:justify-end items-center w-full lg:w-auto px-6 py-4 lg:px-14 order-last lg:order-none">
        <button [routerLink]="['/profile/add-announcement']" class="main-button">Publier une annonce</button>
    </div>
</article>
}
