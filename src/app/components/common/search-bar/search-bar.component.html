<form
    class="w-full mx-4 md:w-2/3 bg-[var(--color-background)] p-3 md:p-1 rounded-2xl md:rounded-full border-2 border-[var(--color-primary)] flex flex-col md:flex-row md:justify-between md:items-center gap-3 md:gap-0"
    [formGroup]="searchForm" (ngSubmit)="onSubmit()" aria-label="barre de recherche d'annonces">

    <!-- Ligne 1 (mobile) : Ville | Segment 1 (≥ md) -->
    <div class="w-full md:w-3/12 md:border-r-2 md:border-[var(--color-primary)] md:pr-2">
        <label for="city" hidden>Recherchez une ville</label>
        <input formControlName="city" type="text" placeholder="Choisissez une ville"
            class="h-[2.5rem] w-full px-3 md:px-2 rounded-lg md:rounded-l-full md:rounded-r-none border md:border-0">
    </div>

    <!-- Groupe mobile (date + durée) ; en ≥ md on “supprime” le wrapper visuel -->
    <div class="w-full flex flex-row gap-3 md:contents">
        <div class="w-1/2 md:w-2/12 md:border-r-2 md:border-[var(--color-primary)] md:px-2">
            <label for="startDate" hidden>Date d'arrivée</label>
            <input formControlName="startDate" type="date"
                class="h-[2.5rem] w-full px-3 md:px-2 rounded-lg md:rounded-none border md:border-0">
        </div>
        <div class="w-1/2 md:w-2/12 md:border-r-2 md:border-[var(--color-primary)] md:px-2">
            <label for="months" hidden>Durée</label>
            <input formControlName="months" type="number" placeholder="Durée"
                class="h-[2.5rem] w-full px-3 md:px-2 rounded-lg md:rounded-none border md:border-0">
        </div>
    </div>

    <!-- Groupe mobile (prix + personnes) ; en ≥ md on “supprime” le wrapper visuel -->
    <div class="w-full flex flex-row gap-3 md:contents">
        <div class="w-1/2 md:w-2/12 md:border-r-2 md:border-[var(--color-primary)] md:px-2">
            <label for="dailyPrice" hidden>Prix journalier</label>
            <input formControlName="dailyPrice" type="number" placeholder="Prix journalier"
                class="h-[2.5rem] w-full px-3 md:px-2 rounded-lg md:rounded-none border md:border-0">
        </div>
        <div class="w-1/2 md:w-2/12 md:px-2">
            <label for="nbPlace" hidden>Nombre de personnes</label>
            <input formControlName="nbPlace" type="number" placeholder="👥 Résidents"
                class="h-[2.5rem] w-full px-3 md:px-2 rounded-lg md:rounded-none border md:border-0">
        </div>
    </div>

    <!-- Bouton : plein largeur en mobile, inline en ≥ md (comme ton original) -->
    <div class="w-full md:w-auto">
        <input type="submit" class="main-button w-full md:w-auto h-[2.5rem]" value="rechercher">
    </div>
</form>
