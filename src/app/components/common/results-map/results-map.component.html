<div class="h-[70vh] w-11/12 justify-self-center sticky top-6">
    <mgl-map [style]="mapStyle" [zoom]="[5]" [center]="[2.35, 46.85]"
        class="w-full h-[500px] rounded-2xl overflow-hidden">
        <mgl-control mglNavigation position="top-right"></mgl-control>
        @if (announcement) {
        <mgl-marker [lngLat]="[+announcement.accomodation.longitude,+announcement.accomodation.latitude]">
            <a [routerLink]="['/announcements', announcement.id]"><img src="/icons/marker.png"
                    alt="Icone de repère de carte"></a>
        </mgl-marker>

        }@else if (announcements) {
        @for (announcement of announcements; track announcement.id) {
        <mgl-marker [lngLat]="[+announcement.accomodation.longitude,+announcement.accomodation.latitude]">
            <a [routerLink]="['/announcements', announcement.id]"><img src="/icons/marker.png"
                    alt="Icone de repère de carte"></a>
        </mgl-marker>
        }
        }
    </mgl-map>
</div>
