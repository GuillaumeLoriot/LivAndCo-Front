<main class="max-w-4xl mx-auto px-6 py-10">
    <h1 class="small-h1-title mb-8">Ajouter une annonce</h1>

    <section aria-labelledby="add-ad-form">
        <h2 id="add-ad-form" class="sr-only">Formulaire d'ajout d'annonce</h2>

        <form action="" method="post" novalidate class="flex flex-col gap-6">
            <!-- Titre -->
            <div class="flex flex-col">
                <label for="title" class="font-bold text-sm mb-2">Titre</label>
                <input id="title" name="title" type="text" value="Penthouse zen"
                    class="bg-[var(--color-background)] border-2 border-[var(--color-primary)] rounded px-3 py-2" />
            </div>

            <!-- Logement associé -->
            <div class="flex flex-col">
                <label for="accommodation" class="font-bold text-sm mb-2">Logement associé à l’annonce</label>
                <div class="relative flex">
                    <select id="accommodation" name="accommodation"
                        class="flex-1 bg-[var(--color-background)] border-2 border-[var(--color-primary)] rounded px-3 py-2 pr-10 appearance-none">
                        <option selected>18 rue du général de gaule</option>
                        <option>12 avenue de la République</option>
                        <option>3 place Bellecour</option>
                    </select>
                </div>
            </div>

            <!-- Prix journalier + Nombre de place -->
            <div class="flex flex-col md:flex-row gap-6">
                <div class="flex flex-col flex-1">
                    <label for="daily-price" class="font-bold text-sm mb-2">Prix journalier</label>
                    <input id="daily-price" name="dailyPrice" type="number" placeholder="Prix journalier"
                        class="bg-[var(--color-background)] border-2 border-[var(--color-primary)] rounded px-3 py-2" />
                </div>
                <div class="flex flex-col flex-1">
                    <label for="capacity" class="font-bold text-sm mb-2">Nombre de place</label>
                    <input id="nbPlace" name="nbPlace" type="number" placeholder="Nombre de personne recommandé"
                        class="bg-[var(--color-background)] border-2 border-[var(--color-primary)] rounded px-3 py-2" />
                </div>
            </div>

            <!-- Équipements (collection de checkbox) -->
            <fieldset class="flex flex-col">
                <legend class="font-bold text-sm mb-2">Équipements privatifs dans une annonce</legend>

                <div class="flex flex-wrap gap-x-6 gap-y-3">
                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="wifi"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Wi-Fi</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="climatisation"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Climatisation</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="chauffage"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Chauffage</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="lave_linge"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Machine à laver</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="lave_vaisselle"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Lave-vaisselle</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="television"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Télévision</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="parking"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Parking</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="ascenseur"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Ascenseur</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="pmr"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Accessible PMR</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="animaux"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Animaux acceptés</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="exterieur"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Espace extérieur (balcon/jardin)</span>
                    </label>

                    <label class="inline-flex items-center gap-2">
                        <input type="checkbox" name="privateEquipments[]" value="bureau"
                            class="[accent-color:var(--color-primary)] w-5 h-5">
                        <span>Bureau / coin travail</span>
                    </label>
                </div>
            </fieldset>


            <!-- Description -->
            <div class="flex flex-col">
                <label for="description" class="font-bold text-sm mb-2">Description</label>
                <textarea id="description" name="description" rows="6" placeholder="lorem ipsum .........."
                    class="bg-[var(--color-background)] border-2 border-[var(--color-primary)] rounded p-3"></textarea>
            </div>

            <!-- Upload photo de couverture -->
            <div class="flex flex-col gap-2">

                <label for="cover" class="inline-flex items-center gap-3 cursor-pointer hover:opacity-80 w-fit">
                    <span class="font-bold text-sm">Télécharger une photo de couverture</span>
                    <img src="/icons/upload.svg" alt="" aria-hidden="true" class="w-6 h-6" />
                </label>
                <input id="cover" name="cover" type="file" accept="image/*" class="sr-only" />
            </div>

            <!-- Boutons -->
            <div class="flex justify-start gap-6 mt-2">
                <button type="button" class="main-button-secondary">
                    Cancel
                </button>
                <button type="submit" class="main-button">
                    Publier l'annonce
                </button>
            </div>
        </form>
    </section>
</main>
