<main class="max-w-5xl mx-auto px-6 py-10">
    <h1 class="small-h1-title mb-8">Modifier le profil</h1>
    
    <section aria-labelledby="profile-edit-form" class="w-full">
        <h2 id="profile-edit-form" class="sr-only">Formulaire de modification du profil</h2>
        
        
            <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
                               
                            <div class="flex justify-end">
                                <img src="/uploads/profile-pictures/{{user?.profilePicture}}" alt="Photo de profil"
                                    class="w-20 h-20 rounded-full object-cover" />
                            </div>
        
                <!-- Nom & Prénom  -->
                <div class="flex flex-col lg:flex-row gap-4 lg:gap-0 justify-between w-5/6 mx-auto">
                    <div class="flex flex-col items-center w-full lg:w-5/12 mb-3">
                        <label for="lastname" class="mb-3 font-bold text-sm">Nom</label>
                        <input type="text" formControlName="lastName"
                            class="bg-neutral-200 text-[var(--color-primary)] w-full h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
                        <app-form-control-error [field]="editForm.get('lastName')"></app-form-control-error>
                    </div>
        
                    <div class="flex flex-col items-center w-full lg:w-5/12 mb-3">
                        <label for="firstName" class="mb-3 font-bold text-sm">Prénom</label>
                        <input type="text" formControlName="firstName"
                            class="bg-neutral-200 text-[var(--color-primary)] w-full h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
                        <app-form-control-error [field]="editForm.get('firstName')"></app-form-control-error>
                    </div>
                </div>
        
                <!-- Email -->
                <div class="flex flex-col items-center mb-3">
                    <label for="email" class="mb-3 font-bold text-sm">Email</label>
                    <input type="email" formControlName="email"
                        class="bg-neutral-200 text-[var(--color-primary)] w-5/6 h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
                    <app-form-control-error [field]="editForm.get('email')"></app-form-control-error>
                </div>
        
                <!-- Adresse -->
                <div class="flex flex-col items-center mb-5">
                    <label for="billingAddress" class="mb-3 font-bold">Adresse</label>
                    <input formControlName="billingAddress" type="text"
                        class="bg-neutral-200 text-[var(--color-primary)] w-5/6 h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
                    <app-form-control-error [field]="editForm.get('billingAddress')"></app-form-control-error>
                </div>
        
                <!-- Profession & Téléphone -->
                <div class="flex flex-col lg:flex-row gap-4 lg:gap-0 justify-between w-5/6 mx-auto">
                    <div class="flex flex-col items-center w-full lg:w-5/12 mb-5">
                        <label for="occupation" class="mb-3 font-bold">Profession</label>
                        <input formControlName="occupation" type="text"
                            class="bg-neutral-200 text-[var(--color-primary)] w-full h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
                        <app-form-control-error [field]="editForm.get('occupation')"></app-form-control-error>
                    </div>
        
                    <div class="flex flex-col items-center w-full lg:w-5/12 mb-5">
                        <label for="phoneNumber" class="mb-3 font-bold">Numéro de téléphone</label>
                        <input formControlName="phoneNumber" type="text"
                            class="bg-neutral-200 text-[var(--color-primary)] w-full h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
                        <app-form-control-error [field]="editForm.get('phoneNumber')"
                            [fieldKey]="'phone'"></app-form-control-error>
                    </div>
                </div>
        
                <!-- Date de naissance & Genre -->
                <div class="flex flex-col lg:flex-row gap-4 lg:gap-0 justify-between w-5/6 mx-auto">
                    <div class="flex flex-col items-center mb-5 w-full lg:w-5/12">
                        <label for="birthDate" class="mb-3 font-bold">Date de naissance</label>
                        <input formControlName="birthDate" type="date"
                            class="bg-neutral-200 text-[var(--color-primary)] w-full h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
                        <app-form-control-error [field]="editForm.get('birthDate')"></app-form-control-error>
                    </div>
        
                    <div class="flex flex-col items-center w-full lg:w-5/12 mb-5">
                        <label for="gender" class="mb-3 font-bold">Genre</label>
                        <select formControlName="gender" name="gender" id="gender"
                            class="bg-neutral-200 text-[var(--color-primary)] w-full h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
                            <option [ngValue]="null" disabled>— Sélectionnez —</option>
                            <option value="male">Homme</option>
                            <option value="female">Femme</option>
                            <option value="other">Autre</option>
                        </select>
                        <app-form-control-error [field]="editForm.get('gender')"></app-form-control-error>
                    </div>
                </div>
        
        
                @if (isLoading) {
                <app-loading></app-loading>
                }
                @if (success) {
                <p class="text-green-700 bg-green-100 rounded-md px-3 py-5 my-5 text-center" aria-live="polite">
                    Profil modifié avec succès.
                </p>
                }
                @if (error) {
                <p class="text-red-700 bg-red-200 rounded-md px-3 py-5 my-5 text-center" aria-live="polite">
                    Une erreur est survenue lors de la modification du profil. Veuillez recommencer
                </p>
                }
        
                <div class="flex justify-center">
                    <input type="submit" name="" id="" class="main-button mt-7">
                </div>
            </form>
    </section>
</main>
