<main class="max-w-4xl mx-auto px-6 py-10">
    <h1 class="small-h1-title mb-8">Modifier le mot de passe</h1>

    <section aria-labelledby="password-edit-form">
        <h2 id="password-edit-form" class="sr-only">Formulaire de modification du mot de passe</h2>

        <form action="" method="post" novalidate class="flex flex-col gap-6" aria-describedby="pwd-note">
            <div class="flex flex-col">
                <label for="current-password" class="font-bold text-sm mb-2">Mot de passe actuel</label>
                <input id="current-password" name="currentPassword" type="password" autocomplete="current-password"
                    class="bg-[var(--color-background)] border-2 border-[var(--color-primary)] rounded px-3 py-2" />
            </div>

            <div class="flex flex-col md:flex-row gap-6">
                <div class="flex flex-col flex-1">
                    <label for="new-password" class="font-bold text-sm mb-2">Nouveau mot de passe</label>
                    <input id="new-password" name="newPassword" type="password" autocomplete="new-password"
                        class="bg-[var(--color-background)] border-2 border-[var(--color-primary)] rounded px-3 py-2" />
                </div>
                <div class="flex flex-col flex-1">
                    <label for="confirm-password" class="font-bold text-sm mb-2">Confirmer le mot de passe</label>
                    <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password"
                        class="bg-[var(--color-background)] border-2 border-[var(--color-primary)] rounded px-3 py-2" />
                </div>
            </div>

            <p id="pwd-note" class="text-sm text-neutral-600">
                Utilisez au moins 8 caractères. Évitez de réutiliser un mot de passe déjà utilisé.
            </p>

            <div class="flex justify-center md:justify-end gap-6 mt-6">
                <button type="submit" class="main-button">
                    Enregistrer
                </button>
            </div>
        </form>
    </section>
</main>
