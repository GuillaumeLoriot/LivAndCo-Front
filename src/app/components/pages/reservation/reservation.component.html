<main>
    <h1 class="text-center mb-7 mt-7">Réservation</h1>
    <section id="reservation-detail" class="flex">
        <form action="" class="w-2/3 p-7">
            <h2 class="mb-4 text-center">Détails résident</h2>
            <div class="flex flex-col items-center mb-5">
                <label for="" class="mb-3 font-bold">Date de naissance</label>
                <input type="date" class="bg-neutral-200 text-[var(--color-primary)] w-5/6 h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
            </div>
            <div class="flex justify-between justify-self-center w-5/6">
                <div class="flex flex-col items-center w-5/12 mb-5">
                    <label for="" class="mb-3 font-bold">Profession</label>
                    <input type="text"
                        class="bg-neutral-200 text-[var(--color-primary)] w-full h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
                </div>
                <div class="flex flex-col items-center w-5/12 mb-5">
                    <label for="" class="mb-3 font-bold">Genre</label>
                    <select name="gender" id="gender" class="bg-neutral-200 text-[var(--color-primary)] w-full h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
                        <option value="">Homme</option>
                        <option value="">Femme</option>
                        <option value="">Autre</option>
                    </select>
                </div>
            </div>
            <div class="flex flex-col items-center mb-5">
                <label for="" class="mb-3 font-bold">Adresse</label>
                <input type="text"
                    class="bg-neutral-200 text-[var(--color-primary)] w-5/6 h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
            </div>
            <div class="flex flex-col items-center mb-5">
                <label for="" class="mb-3 font-bold">Numéro de téléphone</label>
                <input type="text"
                    class="bg-neutral-200 text-[var(--color-primary)] w-5/6 h-[3rem] border-2 border-[var(--color-primary)] rounded-[7px] p-3">
            </div>
            <div class="flex justify-center">
                <input type="submit" name="" id="" class="main-button mt-7">
            </div>

        </form>
        <div class="flex justify-center items-start w-1/3">
            <div class="flex flex-col items-start w-full m-7 bg-[var(--color-secondary-card)] rounded-[30px]">
                <div class="w-full">
                    <img src="/uploads/images/generic-announcement-7.jpg" alt="image de l'annonce"
                        class="h-full w-full object-cover object-center rounded-tl-[30px] rounded-tr-[30px] aspect-[16/9]">
                </div>
                <div class="w-full p-7 ">
                    <hgroup class="mb-7">
                        <h2>Suite zen pour esprit curieux</h2>
                        <h3>Lyon</h3>
                    </hgroup>
                    <div class="flex justify-between mb-7">
                        <div class="flex justify-between w-2/3">
                            <p>1 place</p>
                            <p>1 salle de bain</p>
                            <p>250 m²</p>
                        </div>
                        <div class="flex justify-end w-1/3">
                            <img src="/icons/star.svg" alt="icone d'un étoile de notation">
                            <p>4.83 - 37 avis</p>
                        </div>
                    </div>
                    <p class="text-1xl font-bold">Loyer de 810 € par mois</p>
                </div>
            </div>
        </div>
    </section>
</main>
